name: Release

on:
  push:
    branches: ["release-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-amd64:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: version
      run: |
        TAG=$(sed -n 's/^#define REDIS_VERSION "\(.*\)"/\1/p' src/version.h)
        echo "TAG=$TAG" >> "$GITHUB_ENV"
        echo "DIST=redis-$TAG-linux-amd64" >> "$GITHUB_ENV"

    - name: make
      run: |
        docker run --rm -v "$PWD:/src" -w /src almalinux:8 \
          sh -c 'dnf install -y -q gcc make which && make -j"$(nproc)"'

    - name: package
      run: |
        mkdir -p "$DIST"
        for bin in redis-server redis-cli redis-benchmark; do
          cp "src/$bin" "$DIST/$bin"
          strip "$DIST/$bin"
        done
        tar czf "$DIST.tar.gz" "$DIST"
        sha256sum "$DIST.tar.gz" > sha256sums.txt
        (cd "$DIST" && sha256sum redis-server redis-cli redis-benchmark) >> sha256sums.txt

    - name: release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view "$TAG" >/dev/null 2>&1 || \
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "Redis $TAG binaries for linux/amd64"
        gh release upload "$TAG" --clobber \
          "$DIST.tar.gz" "$DIST"/redis-{server,cli,benchmark} sha256sums.txt
